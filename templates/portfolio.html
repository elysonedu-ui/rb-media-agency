{% extends 'base.html' %}

{% block content %}
<style>
    .portfolio-hero {
        padding: 200px 8% 100px;
    }
    
    .huge-title {
        font-family: var(--font-heading);
        font-size: 6rem;
        font-weight: 600;
        line-height: 1;
        margin-bottom: 30px;
        letter-spacing: -2px;
        text-transform: uppercase;
    }
    
    .portfolio-grid {
        padding: 0 8% 150px;
    }
    
    .project-card {
        width: 100%;
        border-radius: 30px;
        overflow: hidden;
        position: relative;
        background: #080808;
        margin-bottom: 100px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .project-card-inner {
        position: relative;
        width: 100%;
        padding: 100px 50px; /* Instead of ratio, we use padding to fit the 3D model */
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #111 0%, #000 100%);
        overflow: hidden;
    }
    
    /* 3D CSS Mockup */
    .css-mac-mockup {
        width: 80%;
        max-width: 900px;
        aspect-ratio: 16/9;
        background: #050505;
        border-radius: 20px;
        border: 1px solid #333;
        box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 100px rgba(28, 111, 248, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: perspective(1000px) rotateX(5deg) scale(0.95);
        transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 1.2s;
    }
    
    .project-card:hover .css-mac-mockup {
        transform: perspective(1000px) rotateX(0deg) scale(1);
        box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 120px rgba(28, 111, 248, 0.3);
    }
    
    .mac-header {
        height: 40px;
        background: #151515;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 8px;
    }
    
    .mac-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }
    .mac-dot.r { background: #ff5f56; }
    .mac-dot.y { background: #ffbd2e; }
    .mac-dot.g { background: #27c93f; }
    
    .mac-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a0a0a 0%, #020202 100%);
        position: relative;
    }
    
    /* Grid lines for tech feel */
    .mac-grid {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
    }
    
    .mac-content {
        z-index: 2;
        text-align: center;
        width: 100%;
    }
    
    .mac-logo-text {
        font-family: var(--font-heading);
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: #fff;
        text-shadow: 0 0 20px rgba(28, 111, 248, 0.5);
        margin-bottom: 5px;
    }
    
    .mac-logo-text span {
        color: #1c6ff8;
    }
    
    .mac-subtitle {
        font-family: var(--font-mono, monospace);
        font-size: 0.9rem;
        color: #666;
        letter-spacing: 3px;
        margin-bottom: 40px;
    }
    
    .mac-dashboard-cards {
        display: flex;
        gap: 20px;
        justify-content: center;
    }
    
    .mac-dash-card {
        width: 120px;
        height: 120px;
        border-radius: 15px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        position: relative;
        overflow: hidden;
    }
    
    .mac-dash-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: #1c6ff8;
        box-shadow: 0 0 15px #1c6ff8;
    }
    
    .mac-dash-card:nth-child(2)::before { background: #0b3d91; box-shadow: 0 0 15px #0b3d91; }
    .mac-dash-card:nth-child(3)::before { background: #d4af37; box-shadow: 0 0 15px #d4af37; } /* Gold */
    
    .card-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.2);
    }
    
    .card-line {
        width: 60%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }

    .project-info {
        padding: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #000;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    .project-title {
        font-size: 2.5rem;
        font-weight: 500;
        font-family: var(--font-heading);
    }
    
    .project-category {
        font-size: 1.2rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
    }
</style>

<section class="portfolio-hero">
    <h1 class="huge-title reveal-text">NOSSO<br>TRABALHO</h1>
    <p class="reveal-text" style="font-size: 1.5rem; color: var(--text-muted); max-width: 600px;">
        Nós não criamos apenas sites. Desenvolvemos ecossistemas digitais imersivos que convertem visitantes em clientes de alto valor.
    </p>
</section>

<section class="portfolio-grid">
    <a href="http://localhost:5000" target="_blank" style="text-decoration: none; color: inherit;">
        <div class="project-card cursor-link reveal-text" data-cursor-text="PLAY">
            
            <div class="project-card-inner">
                <!-- CSS 3D Mac Mockup Player -->
                <div class="css-mac-mockup">
                    <div class="mac-header">
                        <div class="mac-dot r"></div>
                        <div class="mac-dot y"></div>
                        <div class="mac-dot g"></div>
                    </div>
                    <div class="mac-body">
                        <div class="mac-grid"></div>
                        <div class="mac-content">
                            <div class="mac-logo-text">IMPERIUM <span>BARBER</span></div>
                            <div class="mac-subtitle">[ SAAS ENGINE - PAINEL ADMIN ]</div>
                            
                            <div class="mac-dashboard-cards">
                                <div class="mac-dash-card">
                                    <div class="card-circle"></div>
                                    <div class="card-line"></div>
                                </div>
                                <div class="mac-dash-card">
                                    <div class="card-circle"></div>
                                    <div class="card-line"></div>
                                </div>
                                <div class="mac-dash-card">
                                    <div class="card-circle"></div>
                                    <div class="card-line"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="project-info">
                <div class="project-title">Imperium Barber</div>
                <div class="project-category">Engine & Design</div>
            </div>
        </div>
    </a>
</section>
{% endblock %}
